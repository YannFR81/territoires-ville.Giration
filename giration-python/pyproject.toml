[project]
name = "giration-python"
version = "1.3.0"
description = "Épures de giration des véhicules — portage Python du logiciel Giration du CERTU/CEREMA"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = ["numpy>=1.26", "shapely>=2.0", "ezdxf>=1.1"]

[project.optional-dependencies]
apercu = ["matplotlib"]

[project.scripts]
giration = "giration.cli:main"

[tool.setuptools.package-data]
giration = ["ressources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
